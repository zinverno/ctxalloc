name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Validate declarations
        run: pnpm check:declarations

      - name: Smoke-test the built CLI
        run: pnpm smoke:cli

      - name: Smoke-test the built HTTP API
        run: pnpm smoke:api

      - name: Measure deterministic MVP acceptance
        run: pnpm acceptance:mvp

      - name: Diagnose frozen validation selection
        run: pnpm diagnose:selection

      - name: Evaluate development admission semantics
        run: pnpm development:admission

      - name: Measure frozen held-out context selection
        run: pnpm validation:heldout
